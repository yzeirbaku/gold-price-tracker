<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=19" />
  <title>Danish Market Gold Prices</title>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Danish Market Gold Prices</h1>
      <nav id="tab-strip" class="tab-strip" role="tablist">
        <button data-tab="bars" class="active" type="button" role="tab" aria-selected="true">Bars</button>
        <button data-tab="coins" type="button" role="tab" aria-selected="false">Coins</button>
      </nav>
    </div>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <section id="spot" class="card">
    <div class="card-head">
      <h2>Spot price</h2>
      <div id="spot-updated" class="muted-tiny"></div>
    </div>
    <div id="spot-content">Loading…</div>
  </section>

  <div id="bars-view">
    <section id="size-picker" class="card">
      <h2>Size</h2>
      <div class="buttons">
        <button data-size="2.5">2.5 g</button>
        <button data-size="5">5 g</button>
        <button data-size="10">10 g</button>
        <button data-size="20">20 g</button>
      </div>
    </section>

    <section id="results" class="card">
      <div class="results-head">
        <button id="refresh" class="icon-btn" aria-label="Refresh prices" title="Refresh" hidden>↻</button>
        <div id="status"></div>
      </div>
      <div id="loading" class="loading-msg" hidden></div>
      <table id="listings" hidden>
        <thead>
          <tr>
            <th>Dealer</th>
            <th>Brand</th>
            <th class="sortable" data-sort="price">Price<span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="premium">Premium<span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <div id="coins-view" hidden>
    <section id="coins" class="card">
      <div class="results-head">
        <button id="coins-refresh" class="icon-btn" aria-label="Refresh coins" title="Refresh" hidden>↻</button>
        <div id="coins-status"></div>
      </div>
      <div id="coins-loading" class="loading-msg" hidden></div>
      <table id="coin-listings" hidden>
        <thead>
          <tr>
            <th>Dealer</th>
            <th>Coin</th>
            <th>g (fine)</th>
            <th class="sortable" data-sort="price">Price<span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="premium">Premium<span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>Settings</h2>
      <label>API key
        <input id="api-key" type="password" placeholder="X-API-Key value" required />
      </label>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="save-settings" value="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Chart.js v4, pinned. UMD min build, ~80KB gzip. No date adapter — we use linear scale + ms timestamps with a custom tick formatter. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="config.js?v=19"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
