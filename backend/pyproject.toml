[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Share one event loop across the whole session so the asyncpg pool created
# in tests/api/conftest.py (session-scoped) can be used by every test. Pure-
# logic tests in tests/unit don't depend on loop isolation, so this is safe.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
