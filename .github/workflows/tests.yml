name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Sidecar Postgres so the api/ suite can exercise real FastAPI routes
    # against a real DB. Container port is mapped to localhost so the
    # python process on the runner reaches it as if it were a Neon DSN.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gold
          POSTGRES_PASSWORD: gold
          POSTGRES_DB: goldtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gold:gold@localhost:5432/goldtracker_test
      API_KEY: test-api-key
      MAGIC_LINK_BASE_URL: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy
      - name: Lint
        run: ruff check app tests
      - name: Type-check
        run: mypy app
      - name: Unit tests
        run: pytest tests/unit -v
      - name: API tests
        run: pytest tests/api -v
