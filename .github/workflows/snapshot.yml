name: snapshot

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes (best-effort; GitHub schedules are lossy on free tier)
    - cron: '30 22 * * 0'    # Sunday 22:30 UTC ≈ Mon 00:30 Europe/Copenhagen (weekly report)
    - cron: '30 22 28-31 * *'  # daily 22:30 UTC at month-end; body filters to actual last day
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: POST /snapshot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/20 * * * *'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        # --max-time 90 covers Render free-tier cold starts (which can take
        # 30s) plus the 4 parallel run() calls. --retry 2 buys us another
        # attempt if the very first request times out the cold boot.
        run: |
          curl -fsS \
            --max-time 90 --retry 2 --retry-delay 5 \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            "${BACKEND_URL%/}/snapshot"

      - name: POST /reports/cron weekly
        if: github.event.schedule == '30 22 * * 0'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          curl -fsS \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            "${BACKEND_URL%/}/reports/cron?type=weekly"

      - name: POST /reports/cron monthly (only on last day of month)
        if: github.event.schedule == '30 22 28-31 * *'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        # GitHub cron can't express "last day of month" — fire daily at month-end
        # and let the workflow filter to the true last day (when tomorrow is the 1st).
        run: |
          if [ "$(date -u -d tomorrow +%d)" = "01" ]; then
            curl -fsS \
              --max-time 120 --retry 2 --retry-delay 5 \
              -X POST \
              -H "X-API-Key: ${API_KEY}" \
              "${BACKEND_URL%/}/reports/cron?type=monthly"
          else
            echo "Not the last day of the month — skipping monthly report."
          fi
