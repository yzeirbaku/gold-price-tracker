name: snapshot

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes (best-effort; GitHub schedules are lossy on free tier)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: POST /snapshot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        # --max-time 90 covers Render free-tier cold starts (which can take
        # 30s) plus the 4 parallel run() calls. --retry 2 buys us another
        # attempt if the very first request times out the cold boot.
        run: |
          curl -fsS \
            --max-time 90 --retry 2 --retry-delay 5 \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            "${BACKEND_URL%/}/snapshot"
